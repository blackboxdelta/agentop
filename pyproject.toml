[project]
name = "agentop"
version = "0.1.0"
description = "Local terminal control plane for monitoring and killing AI agent processes across apps (Copilot CLI, MCP tool servers, Ollama, Claude, ChatGPT/Codex, Cursor)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "textual>=0.60.0",
  "psutil>=5.9.0",
  "requests>=2.31.0",
]

[project.scripts]
agentop = "agentop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentop"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
