[project]
name = "agentop"
version = "0.4.1"
description = "Production terminal monitoring and control for Ollama models and local AI agent processes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "textual>=8.2.8,<9",
  "httpx>=0.28.0,<1",
  "psutil>=5.9.0",
  "nvidia-ml-py>=12.560.30",
  "starlette>=0.48.0,<1",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
agentop = "agentop.cli:main"

[project.urls]
Homepage = "https://github.com/blackboxdelta/agentop"
Documentation = "https://github.com/blackboxdelta/agentop#readme"
Issues = "https://github.com/blackboxdelta/agentop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentop"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pyinstaller>=6.10.0,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
